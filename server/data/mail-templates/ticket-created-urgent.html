<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>URGENT Ticket</title>
    <style type="text/css">
        img { max-width: 600px; outline: none; text-decoration: none; -ms-interpolation-mode: bicubic;}
        a img { border: none; }
        table { border-collapse: collapse !important;}
        #outlook a { padding:0; }
        .ReadMsgBody { width: 100%; }
        .ExternalClass { width: 100%; }
        .backgroundTable { margin: 0 auto; padding: 0; width: 100% !important; }
        table td { border-collapse: collapse; }
        .ExternalClass * { line-height: 115%; }
        .container-for-gmail-android { min-width: 600px; }
        * { font-family: Helvetica, Arial, sans-serif; }
        body {
            -webkit-font-smoothing: antialiased;
            -webkit-text-size-adjust: none;
            width: 100% !important;
            margin: 0 !important;
            height: 100%;
            color: #676767;
        }
        td {
            font-family: Helvetica, Arial, sans-serif;
            font-size: 14px;
            color: #777777;
            text-align: center;
            line-height: 21px;
        }
        a { color: #676767; text-decoration: none !important; }
        .force-width-gmail {
            min-width:600px;
            height: 0px !important;
            line-height: 1px !important;
            font-size: 1px !important;
        }
        @media screen {
            * { font-family: 'Oxygen', 'Helvetica Neue', 'Arial', 'sans-serif' !important; }
        }
        @media only screen and (max-width: 480px) {
            table[class*="container-for-gmail-android"] { min-width: 290px !important; width: 100% !important; }
            table[class="w320"] { width: 320px !important; }
            td[class="urgent-banner"] { font-size: 20px !important; padding: 16px 10px !important; }
            td[class="urgent-body"] { padding: 15px 20px !important; }
            td[class="urgent-ticket-num"] { font-size: 22px !important; }
        }
    </style>
</head>
<body bgcolor="#f7f7f7">
<table align="center" cellpadding="0" cellspacing="0" class="container-for-gmail-android" width="100%">
    <!-- Header with logo -->
    <tr>
        <td align="left" valign="top" width="100%" style="background-color: #ffffff;">
            <center>
                <table cellspacing="0" cellpadding="0" width="100%" bgcolor="#ffffff" style="border-bottom: 1px solid #cccccc">
                    <tr>
                        <td width="100%" height="80" valign="top" style="text-align: center; vertical-align:middle;">
                            <center>
                                <table cellpadding="0" cellspacing="0" width="600" class="w320">
                                    <tr>
                                        <td style="vertical-align: middle;padding: 15px 0;">
                                            <img src="{{IMAGE_HEADER_URL}}" alt="logo">
                                        </td>
                                    </tr>
                                </table>
                            </center>
                        </td>
                    </tr>
                </table>
            </center>
        </td>
    </tr>

    <!-- URGENT BANNER -->
    <tr>
        <td align="center" valign="top" width="100%">
            <center>
                <table cellspacing="0" cellpadding="0" width="600" class="w320">
                    <tr>
                        <td class="urgent-banner" style="background-color: #dc3545; color: #ffffff; font-size: 26px; font-weight: 700; padding: 20px 15px; letter-spacing: 2px; text-transform: uppercase;">
                            &#9888; URGENT TICKET &#9888;
                        </td>
                    </tr>
                </table>
            </center>
        </td>
    </tr>

    <!-- Body content -->
    <tr>
        <td align="center" valign="top" width="100%" style="background-color: #f7f7f7; padding: 0;">
            <center>
                <table cellspacing="0" cellpadding="0" width="600" class="w320">
                    <!-- Subtitle -->
                    <tr>
                        <td class="urgent-body" style="padding: 25px 40px 10px; font-size: 16px; color: #333333; line-height: 24px; text-align: center;">
                            {{TICKET_CREATED_URGENT_MATCH_1}}
                        </td>
                    </tr>
                    <tr>
                        <td class="urgent-body" style="padding: 5px 40px 20px; font-size: 14px; color: #555555; line-height: 22px; text-align: center;">
                            {{TICKET_CREATED_URGENT_MATCH_2}}
                        </td>
                    </tr>

                    <!-- Ticket number block -->
                    <tr>
                        <td style="padding: 0 50px 10px;">
                            <table cellspacing="0" cellpadding="0" width="100%" style="border-collapse: separate !important;">
                                <tr>
                                    <td style="background-color: #ffffff; border: 2px solid #dc3545; border-radius: 8px; padding: 30px 40px;">
                                        <table cellpadding="0" cellspacing="0" width="100%">
                                            <tr>
                                                <td style="font-size: 13px; color: #999999; text-transform: uppercase; letter-spacing: 1px; padding-bottom: 8px;">
                                                    Ticket Number
                                                </td>
                                            </tr>
                                            <tr>
                                                <td class="urgent-ticket-num" style="font-size: 28px; font-weight: 700; color: #dc3545; padding-bottom: 15px;">
                                                    #{{ticketNumber}}
                                                </td>
                                            </tr>
                                            <tr>
                                                <td style="font-size: 14px; color: #333333; padding-bottom: 5px;">
                                                    <strong>Title:</strong> {{title}}
                                                </td>
                                            </tr>
                                            <tr>
                                                <td style="font-size: 14px; color: #333333;">
                                                    <strong>Submitted by:</strong> {{name}}
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Phone availability notice -->
                    <tr>
                        <td style="padding: 10px 50px 25px;">
                            <table cellspacing="0" cellpadding="0" width="100%" style="border-collapse: separate !important;">
                                <tr>
                                    <td style="background-color: #fff3cd; border: 1px solid #ffc107; border-radius: 6px; padding: 15px 20px; text-align: center;">
                                        <span style="font-size: 14px; color: #856404; line-height: 22px;">
                                            {{TICKET_CREATED_URGENT_MATCH_3}}<br /><strong style="font-size: 16px; color: #664d03;">&#128222; {{phone}}</strong>
                                        </span>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                </table>
            </center>
        </td>
    </tr>

    <!-- Footer -->
    <tr>
        <td align="center" valign="top" width="100%" style="background-color: #ffffff; border-top: 1px solid #e5e5e5; border-bottom: 1px solid #e5e5e5; height: 100px;">
            <center>
                <table cellspacing="0" cellpadding="0" width="600" class="w320">
                    <tr>
                        <td style="padding: 25px 0 25px;">
                            <strong>IT Support (AZCO)</strong><br />
                            Urgent tickets require immediate attention<br /><br />
                        </td>
                    </tr>
                </table>
            </center>
        </td>
    </tr>
</table>
</body>
</html>
